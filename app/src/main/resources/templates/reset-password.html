<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8" /><title>Reset password | @Sea</title></head>
<body>
  <h1>Reset password</h1>
  <p th:if="${error}" th:text="${error}" role="alert"></p>
  <p th:if="${message}" th:text="${message}" role="status"></p>
  <form th:unless="${message}" action="/reset-password" method="post">
    <input type="hidden" name="token" th:value="${token}" />
    <label>New password <input type="password" name="password" autocomplete="new-password" maxlength="255" required="required" /></label>
    <button type="submit">Change password</button>
  </form>
  <p><a href="/forgot-password">Request another reset email</a> | <a href="/">Back to store</a></p>
</body>
</html>
