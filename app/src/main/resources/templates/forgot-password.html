<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8" /><title>Forgot password | @Sea</title></head>
<body>
  <h1>Forgot password</h1>
  <p>Enter your username to receive a password reset email.</p>
  <p th:if="${message}" th:text="${message}" role="status"></p>
  <form action="/forgot-password" method="post">
    <label>Username <input name="username" autocomplete="username" required="required" /></label>
    <button type="submit">Send reset email</button>
  </form>
  <p><a href="/">Back to store</a></p>
</body>
</html>
